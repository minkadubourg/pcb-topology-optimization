[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcbtopo"
version = "0.1.0"
description = "Density-based topology optimization of copper layouts on printed circuit boards (NGSolve)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Minka Dubourg" }]
dependencies = ["ngsolve>=6.2", "numpy", "scipy", "matplotlib", "pandas", "mmapy>=0.3"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["pcbtopo*"]
